<style>
:root{
  --ink:#161320;
  --ink-2:#241B33;
  --indigo:#1d1730;
  --violet:#7A37CF;
  --violet-soft:#9A5FE0;
  --paper:#F4F2F8;
  --paper-2:#EAE5F1;
  --paper-3:#DED7EA;
  --line:rgba(22,19,32,0.16);
  --muted:rgba(22,19,32,0.56);
  --accent:#7A37CF;
  --bg:var(--paper);
  --fg:var(--ink);
  --fg-muted:var(--muted);
  --hair:var(--line);
  --ff-display:"Bodoni Moda", Georgia, serif;
  --ff-body:"Newsreader", Georgia, serif;
  --ff-sans:"Libre Franklin", system-ui, sans-serif;
  --ff-mono:"IBM Plex Mono", ui-monospace, monospace;
  --maxw:1180px;
}
*{margin:0;padding:0;box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{
  background:var(--bg);
  color:var(--fg);
  font-family:var(--ff-body);
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
  overflow-x:hidden;
}
::selection{background:var(--accent);color:#fff;}
a{color:inherit;text-decoration:none;}
a:hover:not(.card-hover):not(.btn):not(.nav-link):not(.kicker):not(.sec-row):not(.foot-link){
  text-decoration:underline;
  text-decoration-color:var(--accent);
  text-underline-offset:3px;
  text-decoration-thickness:1px;
}
.foot-link:hover{text-decoration:underline;text-decoration-color:rgba(244,242,248,0.5);text-underline-offset:3px;text-decoration-thickness:1px;}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
img{display:block;max-width:100%;}

.surface-dark{
  --bg:var(--ink);--fg:var(--paper);
  --fg-muted:rgba(244,242,248,0.6);
  --hair:rgba(244,242,248,0.16);
  background:var(--bg);color:var(--fg);
}
.mono{font-family:var(--ff-mono);letter-spacing:0.04em;}
.kicker{
  font-family:var(--ff-sans);font-weight:600;
  text-transform:uppercase;letter-spacing:0.22em;
  font-size:11.5px;color:var(--accent);
}
.label{
  font-family:var(--ff-mono);text-transform:uppercase;
  letter-spacing:0.13em;font-size:11px;color:var(--fg-muted);
}
.serif-it{font-family:var(--ff-body);font-style:italic;}

/* duotone */
.duotone{position:relative;overflow:hidden;background:var(--ink-2);}
.duotone::before{
  content:"";position:absolute;inset:0;
  background:
    repeating-linear-gradient(135deg,
      transparent 0 9px,
      color-mix(in oklab, var(--accent), #000 8%) 9px 18px),
    linear-gradient(160deg, var(--accent) 0%, #2a1d44 90%);
  opacity:0.92;
}
.duotone .duotone-credit{
  position:absolute;right:11px;bottom:9px;z-index:3;
  font-family:var(--ff-mono);font-size:9px;letter-spacing:0.1em;
  text-transform:uppercase;color:rgba(255,255,255,0.78);
  text-shadow:0 1px 4px rgba(0,0,0,0.6);
}
.duotone:has(img)::after{
  content:"";position:absolute;left:0;right:0;bottom:0;height:38%;z-index:2;
  background:linear-gradient(to top, rgba(15,8,26,0.42), transparent);pointer-events:none;
}
.duotone .duotone-mark{
  position:absolute;right:16px;top:14px;z-index:2;color:rgba(255,255,255,0.85);
}
.duotone .duotone-brief{
  position:absolute;inset:0;z-index:2;display:flex;flex-direction:column;
  align-items:center;justify-content:center;text-align:center;
  gap:9px;padding:14% 12%;
}
.duotone .duotone-brief-tag{
  font-family:var(--ff-mono);font-size:9.5px;letter-spacing:0.22em;text-transform:uppercase;
  color:rgba(255,255,255,0.7);white-space:nowrap;
}
.duotone .duotone-brief-text{
  font-family:var(--ff-body);font-style:italic;
  font-size:clamp(13px,1.15vw,17px);line-height:1.3;color:rgba(255,255,255,0.94);
  text-wrap:balance;max-width:34ch;
}

/* progress bar */
#read-progress{
  position:fixed;top:0;left:0;height:3px;width:0%;
  background:var(--accent);z-index:120;transition:width .08s linear;
}

/* entrance */
.route-enter{animation:routeIn .5s cubic-bezier(.2,.7,.2,1) both;}
@keyframes routeIn{from{transform:translateY(8px);}to{transform:none;}}

/* scroll reveal */
.fadeup{transition:opacity .7s cubic-bezier(.2,.7,.2,1), transform .7s cubic-bezier(.2,.7,.2,1);}
html.do-reveal .fadeup{opacity:0;transform:translateY(22px);}
html.do-reveal .fadeup.in{opacity:1;transform:none;}

/* layout */
.wrap{max-width:var(--maxw);margin:0 auto;padding:0 32px;}
.hairline{height:1px;background:var(--hair);border:0;}
@media (max-width:720px){ .wrap{padding:0 20px;} }

/* buttons */
.btn{
  display:inline-flex;align-items:center;gap:10px;
  font-family:var(--ff-sans);font-weight:600;font-size:13px;
  letter-spacing:0.04em;padding:13px 22px;border-radius:2px;
  transition:transform .2s, background .2s, color .2s;
}
.btn-solid{background:var(--accent);color:#fff;border:1px solid var(--accent);}
.btn-solid:hover{background:#fff;color:var(--accent);border-color:var(--accent);transform:translateY(-1px);}
.btn-ghost{background:transparent;color:var(--fg);border:1px solid var(--hair);}
.btn-ghost:hover{background:var(--accent);color:#fff;border-color:var(--accent);}

/* dark surface overrides — ghost on dark bg flips to white fill */
.surface-dark .btn-ghost{border-color:rgba(244,242,248,0.35);color:var(--paper);}
.surface-dark .btn-ghost:hover{background:var(--paper);color:var(--ink);border-color:var(--paper);}
.surface-dark .btn-solid:hover{background:var(--paper);color:var(--accent);border-color:var(--paper);}

input,textarea,select{font-family:var(--ff-sans);font-size:15px;color:var(--fg);}

#loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:var(--ink);z-index:9999;transition:opacity .5s;}
#loading svg{width:72px;height:72px;animation:symbolPulse 1.4s ease-in-out infinite;}
@keyframes symbolPulse{0%,100%{opacity:1;transform:scale(1);}50%{opacity:0.5;transform:scale(0.92);}}

/* hover */
.card-hover h3,.card-hover h2{transition:color .25s;}
.card-hover:hover h3,.card-hover:hover h2{color:var(--accent);}
.card-hover .duotone{transition:transform .5s cubic-bezier(.2,.7,.2,1);}
.card-hover:hover .duotone{transform:translateY(-4px);}
.nav-link{position:relative;transition:color .2s;}
.nav-link:hover{color:var(--accent);text-decoration:underline;text-decoration-color:var(--accent);text-underline-offset:3px;text-decoration-thickness:1px;}
.foot-link{transition:color .2s;}
.foot-link:hover{color:rgba(244,242,248,1);}
.sec-row{transition:background .2s;}
.sec-row:hover .sec-name{color:var(--accent);transition:color .25s;}
.sec-row:hover .sec-arrow{transform:translateX(8px);color:var(--accent);}

/* typography variants */
body.type-grand h1{letter-spacing:-0.035em !important;}
body.type-grand .route-enter h1{font-size:clamp(42px,8vw,108px) !important;line-height:0.92 !important;}
body.type-grand h2{letter-spacing:-0.03em !important;}

/* search overlay */
.search-overlay{
  position:fixed;inset:0;z-index:200;
  background:rgba(22,19,32,0.82);
  backdrop-filter:blur(8px);
  display:flex;align-items:flex-start;justify-content:center;
  padding-top:15vh;
  animation:fadeIn .2s ease both;
}
@keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
.search-box{
  width:min(680px,90vw);
  background:var(--paper);
  border-radius:4px;
  overflow:hidden;
  box-shadow:0 24px 80px rgba(0,0,0,0.4);
}
.search-input{
  width:100%;padding:20px 24px;
  font-family:var(--ff-display);font-size:22px;font-weight:600;
  border:none;outline:none;background:transparent;
  border-bottom:1px solid var(--hair);
}
.search-results{max-height:420px;overflow-y:auto;}
.search-result-item{
  display:flex;gap:14px;padding:14px 24px;
  border-bottom:1px solid var(--hair);
  cursor:pointer;transition:background .15s;
  align-items:center;
}
.search-result-item:hover{background:var(--paper-2);}
.search-result-item:last-child{border-bottom:none;}
.search-empty{padding:32px 24px;text-align:center;color:var(--fg-muted);font-family:var(--ff-body);font-style:italic;}

/* filter chips (archive + contributors) */
.chip{transition:background .18s,color .18s,border-color .18s;}
.chip-active{background:var(--accent);color:#fff;border-color:var(--accent);}
.chip-idle{background:transparent;color:var(--fg-muted);border-color:var(--hair);}
.chip-idle:hover{background:var(--accent);color:#fff;border-color:var(--accent);}

/* audio play button */
.play-btn{transition:background .18s,transform .18s;}
.play-btn:hover{background:var(--ink) !important;transform:scale(1.07);}

/* action buttons (save / share) */
.action-btn{transition:background .18s,color .18s,border-color .18s;}
.action-btn:hover{background:var(--accent) !important;color:#fff !important;border-color:var(--accent) !important;}
.action-btn.saved:hover{background:transparent !important;color:var(--fg-muted) !important;border-color:var(--hair) !important;}

/* bookmark button */
.bookmark-btn{
  display:inline-flex;align-items:center;gap:8px;
  font-family:var(--ff-mono);font-size:11px;letter-spacing:0.1em;
  text-transform:uppercase;padding:10px 16px;
  border:1px solid var(--hair);border-radius:2px;
  transition:all .2s;color:var(--fg-muted);
}
.bookmark-btn:hover,.bookmark-btn.saved{
  border-color:var(--accent);color:var(--accent);
}

/* share toast */
.share-toast{
  position:fixed;bottom:32px;left:50%;transform:translateX(-50%);
  background:var(--ink);color:var(--paper);
  font-family:var(--ff-mono);font-size:12px;letter-spacing:0.08em;
  padding:12px 22px;border-radius:2px;
  z-index:300;animation:toastIn .3s ease both;
  pointer-events:none;
}
@keyframes toastIn{from{transform:translateX(-50%) translateY(12px);opacity:0;}to{transform:translateX(-50%) translateY(0);opacity:1;}}

/* responsive */
@media (max-width:860px){
  .desk-nav{display:none !important;}
  .burger{display:grid !important;place-items:center;}
}
@media (max-width:820px){
  .route-enter [style*="grid-template-columns: repeat(3"],
  section [style*="repeat(3,1fr)"]{grid-template-columns:1fr 1fr !important;}
}
@media (max-width:680px){
  [style*="grid-template-columns: 1.05fr"],
  [style*="grid-template-columns: 1.1fr 1fr"],
  [style*="grid-template-columns: 0.85fr"],
  [style*="grid-template-columns: 1fr 1fr"],
  [style*="grid-template-columns: repeat(3,1fr)"],
  [style*="grid-template-columns: repeat(2"],
  [style*="grid-template-columns: 200px 1fr"],
  [style*="grid-template-columns: 180px 1fr"],
  [style*="grid-template-columns: 160px 1fr"],
  [style*="grid-template-columns: 84px 1fr"],
  [style*="grid-template-columns: 1.4fr 1fr 1fr 1fr"],
  [style*="grid-template-columns: 1.15fr"],
  [style*="grid-template-columns: 1.4fr"]{grid-template-columns:1fr !important;}
  .burger{display:grid !important;place-items:center;}
}
@media (max-width:860px){
  .desk-nav{display:none !important;}
  .burger-wrap{display:flex !important;align-items:center;gap:4px;}
}
</style>
